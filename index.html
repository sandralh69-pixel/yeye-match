*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#281238,#713b83);color:white;font-family:Arial,sans-serif;text-align:center}main{max-width:480px;margin:auto;padding:18px}h1{margin:8px}.stats{display:flex;justify-content:space-around;background:#ffffff22;border-radius:14px;padding:12px;margin:14px 0}.stats b{display:block;color:#ffda79;font-size:23px}#board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#ffffff20;padding:9px;border-radius:16px}.tile{aspect-ratio:1;border:0;border-radius:11px;background:#fff1e9;font-size:clamp(25px,8vw,38px);box-shadow:inset 0 -4px #d6a7c7}.selected{outline:4px solid #ffd66b}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{flex:1;padding:12px;border:0;border-radius:12px;background:#ffd66b;font-weight:bold}#msg{min-height:40px}small{display:block;margin-top:14px;color:#f8dff0}</style></head><body><main><h1>👑 YEYÉ MATCH</h1><p>Combina sabores venezolanos 🇻🇪</p><div class="stats"><div>Puntos<b id="score">0</b></div><div>Movimientos<b id="moves">20</b></div><div>Nivel<b id="level">1</b></div></div><p>🎯 Objetivo: consigue 300 puntos</p><div id="board"></div><div class="buttons"><button id="restart">Reiniciar</button><button id="help">Cómo jugar</button></div><p id="msg">Selecciona dos productos vecinos para intercambiarlos.</p><small>Prototipo gratuito. Los puntos son solo de juego y no se canjean por premios reales.</small></main><script>
const foods=['🥫','🧀','🍫','🍪','🥛','🫙'],N=6;let a=[],score=0,moves=20,sel=null;const $=x=>document.getElementById(x);function init(){a=Array.from({length:36},()=>Math.floor(Math.random()*6));score=0;moves=20;sel=null;draw();msg('¡A jugar! Junta tres o más productos iguales.')}function draw(){let b=$('board');b.innerHTML='';a.forEach((v,i)=>{let e=document.createElement('button');e.className='tile'+(sel===i?' selected':'');e.textContent=foods[v];e.onclick=()=>tap(i);b.append(e)});$('score').textContent=score;$('moves').textContent=moves;$('level').textContent=1+Math.floor(score/300)}function msg(t){$('msg').textContent=t}function near(i,j){return Math.abs(i-j)===6||(Math.abs(i-j)===1&&Math.floor(i/6)===Math.floor(j/6))}function find(){let s=new Set();for(let r=0;r<6;r++)for(let c=0;c<6;c++){let i=r*6+c,v=a[i],h=[i],w=[i];for(let x=c+1;x<6&&a[r*6+x]===v;x++)h.push(r*6+x);for(let y=r+1;y<6&&a[y*6+c]===v;y++)w.push(y*6+c);if(h.length>2)h.forEach(x=>s.add(x));if(w.length>2)w.forEach(x=>s.add(x))}return [...s]}function resolve(){let count=0,ms=find();while(ms.length&&count++<10){score+=ms.length*10;ms.forEach(i=>a[i]=-1);for(let c=0;c<6;c++){let col=[];for(let r=5;r>=0;r--)if(a[r*6+c]!==-1)col.push(a[r*6+c]);for(let r=5;r>=0;r--)a[r*6+c]=col[5-r]??Math.floor(Math.random()*6)}ms=find()}draw()}function tap(i){if(moves<=0)return;if(sel===null){sel=i;draw();return}let j=sel;sel=null;if(i===j){draw();return}if(!near(i,j)){sel=i;draw();return}[a[i],a[j]]=[a[j],a[i]];if(!find().length){[a[i],a[j]]=[a[j],a[i]];msg('Ese movimiento no forma una combinación. Prueba otro.');draw();return}moves--;resolve();msg(score>=300?'🎉 ¡Objetivo conseguido!':moves===0?'Partida terminada. Reinicia para jugar otra vez.':'¡Buena combinación!')}$('restart').onclick=init;$('help').onclick=()=>msg('Toca dos casillas vecinas para intercambiarlas. Junta tres o más productos iguales en línea.');init();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
